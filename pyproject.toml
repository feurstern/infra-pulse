[project]
name = "infrapulse"
version = "0.1.0.dev0"
description = "CPU-first, explainable anomaly detection for infrastructure metrics."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "feurstern" }]
maintainers = [{ name = "feurstern" }]
requires-python = ">=3.11"
keywords = ["anomaly-detection", "infrastructure", "monitoring", "observability", "sre", "time-series"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# pandas 3 is required: the code relies on its default `str` dtype and on Copy-on-Write.
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
]

[project.urls]
Author = "https://github.com/feurstern"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
    "NPY",  # NumPy rules (NPY002 bans the legacy global random state)
    "PD",   # pandas-vet
    "DTZ",  # bans timezone-naive datetime construction
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["infrapulse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
